name: MailFlow CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mailflow_test
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean verify -B -Dspring.profiles.active=test
        env:
          DB_URL: jdbc:h2:mem:testdb
          JWT_SECRET: ci-test-secret-key-at-least-256-bits-long-for-tests
          REDIS_HOST: localhost
          RABBITMQ_HOST: localhost

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Build Docker image (verify Dockerfile)
        run: docker build -t mailflow-backend:ci .
        if: github.ref == 'refs/heads/main'

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true   # non-blocking; enforce separately

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

      - name: Verify build output
        run: ls -lh dist/

  # ── Security scan ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # Non-blocking for now; set to '1' to block on critical findings
